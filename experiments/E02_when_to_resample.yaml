# E02. Run: make run E=E02   or   python -m pfexp.run experiments/E02_when_to_resample.yaml
title: When should the filter resample?
question: >
  Is it better to resample every step, never, or only when the particles degenerate (measured by the
  effective sample size (ESS) or by the largest weight), and how much does the threshold matter?
hypothesis: >
  Never resampling collapses onto a few particles and loses track. Resampling every step keeps
  track but wastes diversity. An ESS threshold around 0.5 gives the lowest error with the fewest
  resampling steps; the max-weight rule behaves similarly but is more sensitive to its threshold.
filter: mcl
world: {}
fixed:
  n_particles: 100
  proposal: motion_model
  resampler: systematic
vary:
  trigger:
    - every_step
    - never
    - {name: ess_threshold, threshold: 0.2}
    - {name: ess_threshold, threshold: 0.5}
    - {name: ess_threshold, threshold: 0.8}
    - {name: max_weight, threshold: 0.1}    # resample when 1/max(w) < threshold * N
    - {name: max_weight, threshold: 0.2}
    - {name: max_weight, threshold: 0.5}
seeds: 20
quick:
  seeds: 3
report:
  metrics: [position_rmse, resample_rate, unique_after_resampling, ess_mean, nees_median]
  traces: [ess, position_error]
