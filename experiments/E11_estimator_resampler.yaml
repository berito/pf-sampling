# E11 (estimator vs resampler). Run: python -m pfexp.run experiments/E11_estimator_resampler.yaml
title: Does the resampling scheme change what can be learned?
question: >
  The same sweep of the assumed range noise under the four resampling schemes. E01 showed that they
  keep different numbers of distinct particles; does that carry through to the likelihood estimate and
  to the value it picks out?
hypothesis: >
  The schemes differ in particle diversity rather than in the weights themselves, so the estimates
  should be close, with the schemes that keep fewer distinct particles giving a slightly noisier
  likelihood.
filter: mcl
world: {}
fixed:
  proposal: motion_model
  trigger: {name: ess_threshold, threshold: 0.5}
  n_particles: 200         # few enough that the schemes differ, as in E01
  start: known
  bearing_std: 0.05
  forward_std: 0.005
  turn_std: 0.002
vary:
  resampler: [multinomial, residual, stratified, systematic]
  range_std: [0.08, 0.107, 0.142, 0.19, 0.253, 0.337, 0.45, 0.6, 0.8]
seeds: 20
quick:
  seeds: 3
  vary: {range_std: [0.08, 0.19, 0.45]}
report:
  metrics: [log_likelihood, position_rmse]
  traces: []
  best: log_likelihood
