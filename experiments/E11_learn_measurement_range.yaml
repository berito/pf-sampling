# E11 (measurement noise). Run: make run E=E11   or   python -m pfexp.run experiments/E11_learn_measurement_noise.yaml
title: Can the measurement noise be learned from the data? (range)
question: >
  The filter is told how noisy its range sensor is. Sweeping that assumption and scoring each value by
  the marginal likelihood of the recorded measurements, does the best-scoring value match the noise the
  world actually used (0.2 m), and does it agree with the value that gives the lowest error?
hypothesis: >
  The likelihood peaks at the true value: assuming too little noise makes real measurements look
  impossible, assuming too much makes every pose look equally good. The lowest error may sit elsewhere,
  since a filter with too few particles is helped by a wider assumed noise.
filter: mcl
world: {}                  # Elfring's running-example world: true range noise 0.2 m, bearing 0.05 rad
fixed:
  proposal: motion_model   # the marginal likelihood estimate needs a bootstrap proposal
  resampler: systematic
  trigger: {name: ess_threshold, threshold: 0.5}
  n_particles: 2000
  start: known             # tracking, not global localization
  bearing_std: 0.05        # the other three at the world's true values
  forward_std: 0.005
  turn_std: 0.002
vary:
  range_std: [0.08, 0.107, 0.142, 0.19, 0.253, 0.337, 0.45, 0.6, 0.8]
seeds: 20
quick:
  seeds: 3
  vary: {range_std: [0.08, 0.19, 0.45]}
report:
  metrics: [log_likelihood, position_rmse]
  traces: []
  best: log_likelihood
