# E11 (start regime). Run: python -m pfexp.run experiments/E11_start_regime.yaml
title: Does learning depend on the filter tracking at all?
question: >
  The same sweep of the assumed range noise, run from a known start pose and from the uniform start
  that E01-E04 use. Does the likelihood still pick out the true value (0.2 m) when the filter has to
  find the robot from scratch?
hypothesis: >
  From a known start the likelihood peaks at the true value. From a uniform start the filter cannot
  find the robot while it assumes the true, small noise, so the estimate collapses and the likelihood
  keeps rewarding wider noise instead: learning rests on the inference working first.
filter: mcl
world: {}
fixed:
  proposal: motion_model
  resampler: systematic
  trigger: {name: ess_threshold, threshold: 0.5}
  n_particles: 2000
  bearing_std: 0.05
  forward_std: 0.005
  turn_std: 0.002
vary:
  start: [known, uniform]
  range_std: [0.08, 0.107, 0.142, 0.19, 0.253, 0.337, 0.45, 0.6, 0.8]
seeds: 20
quick:
  seeds: 3
  vary: {range_std: [0.08, 0.19, 0.45]}
report:
  metrics: [log_likelihood, position_rmse]
  traces: []
  best: log_likelihood
