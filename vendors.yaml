# Upstream code this project uses. Nothing here is shipped with the project:
# tools/fetch_vendors.py clones each repo into vendor/<name> at the pinned commit.
#
#   name     folder under vendor/
#   url      upstream git repository
#   commit   full commit hash to check out (the experiments were run against this)
#   sparse   optional: only check out these paths (folders or files)
#   licence  upstream licence; see THIRD_PARTY.md for what that means for us

vendors:
  - name: particle_filter_tutorial
    url: https://github.com/jelfring/particle-filter-tutorial
    commit: e6014b727d0ab0d6607f9f7b8c446f81b80fda72
    licence: MIT

  - name: pythonrobotics
    url: https://github.com/AtsushiSakai/PythonRobotics
    commit: 1fe4fb980f6a12fe21c3c33d2b4da97a52c9154d
    sparse: [SLAM/FastSLAM1, SLAM/FastSLAM2, utils, requirements, LICENSE]
    licence: MIT

  - name: openslam_gmapping
    url: https://github.com/OpenSLAM-org/openslam_gmapping
    commit: 79ef0b0e6d9a12d6390ae64c4c00d37d776abefb
    licence: CC BY-NC-SA 2.0

